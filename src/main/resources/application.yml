spring:
  application:
    name: auth-service
    group: com.sageDelta
  config:
    import:
      - optional:classpath:config/admin.yaml
      - optional:classpath:config/secret.yaml

# managing server configuration
---
server:
  port: 8003
  servlet:
    session:
      cookie:
        name: SESSION_
      timeout: 24h

# logging
---
logging:
  level:
    root: WARN
    org:
      sageDelta:
        auth_service: INFO

# managing dataSource
---
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sage_delta}
    username: "${DB_USER:admin}"
    password: "${DB_PASSWORD:admin123}"
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${DB_SQL_MODE:always}
      schema-locations:
        - optional:classpath:database/schema.sql
  data:
    redis:
      host: ${DATA_REDIS_HOST:localhost}
      post: ${DATA_REDIS_PORT:6379}

  session:
    timeout: 1d
    remember-me-timeout: 30d # 30 days
    remember-me-secret: ${REMEMBER_ME_SECRET:wUJb/PEKXQDMhqnEP+B3GsDtI/cwCjyAdBxZ4TNg0/0=}



---
client-ui:
  url: ${ID_PROVIDER_UI:http://localhost:3000}

---
clients:
  lets-split:
    client-id: ${CLIENT_ID:11001}
    redirect-urls:
      - http://localhost:3000
    client-secret: ${LETS_SPLIT_CLIENT_SECRET:g7hyJ3SDJActBtuXdb4OCN951IJUVillRrvyuSHWmV0=}