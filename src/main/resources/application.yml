spring:
  application:
    name: auth-service
    group: com.sageDelta

# managing server properties
---
server:
  port: 8003
  servlet:
    session:
      cookie:
        name: SESSION_
      timeout: 24h
  use-forward-headers: true

# logging
---
logging:
  level:
    root: DEBUG
    org:
      sageDelta:
        auth_service: INFO

# managing dataSource
---
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sage_delta}
    username: "${DB_USER:admin}"
    password: "${DB_PASSWORD:admin123}"
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${DB_SQL_MODE:always}
      schema-locations:
        - optional:classpath:database/schema.sql
  data:
    redis:
      host: ${DATA_REDIS_HOST:localhost}
      post: ${DATA_REDIS_PORT:6379}
      connect-timeout: 30s

  session:
    timeout: 1d
    remember-me-timeout: 30d # 30 days
    remember-me-secret: ${REMEMBER_ME_SECRET:wUJb/PEKXQDMhqnEP+B3GsDtI/cwCjyAdBxZ4TNg0/0=}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URL:http://localhost:8003/api/v1/oauth2/google/callback}
            endpoint: /api/v1/oauth2/google/callback

          github:
            client-id: ${GITHUB_CLIENT:}
            client-secret: ${GITHUB_SECRET:}
            scope:
              - read:user
              - user:email
            redirect-uri: ${GITHUB_REDIRECT_URL:http://localhost:8003/api/v1/oauth2/github/callback}

---
id-provider-ui:
  url: ${ID_PROVIDER_UI:http://localhost:3000}

---
# clients Details
clients:
  lets-split:
    client-id: ${CLIENT_ID:11001}
    redirect-urls:
      - http://localhost:3000
    client-secret: ${LETS_SPLIT_CLIENT_SECRET:g7hyJ3SDJActBtuXdb4OCN951IJUVillRrvyuSHWmV0=}
  cors:
    - http://localhost:3000
    - http://localhost:8080

